<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | AutoStock</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background: #0d0d0f; color: #e8e2d9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { background: #141417; border: 1px solid #2a2724; border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.login-card h1 { font-size: 24px; color: #e8e2d9; margin-bottom: 8px; }
.login-card p { color: #8a8580; font-size: 14px; margin-bottom: 24px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 14px; font-weight: 500; color: #8a8580; margin-bottom: 8px; }
.form-group input { width: 100%; padding: 12px 14px; border-radius: 6px; border: 1px solid #2a2724; background: #0d0d0f; color: #e8e2d9; font-size: 15px; outline: none; }
.form-group input:focus { border-color: #c45d3e; }
.btn-submit { width: 100%; padding: 14px; border: none; border-radius: 6px; background: #c45d3e; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
.btn-submit:hover { background: #e06a4a; color: #fff; }
.error { background: rgba(200, 50, 50, 0.15); color: #ff6b6b; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; border: 1px solid rgba(200, 50, 50, 0.3); }
</style>
</head>
<body>
<div class="login-card">
  <h1>AutoStock Admin</h1>
  <p>Sign in to manage your dealership.</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/admin/login">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="admin@dealership.com" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-submit">Sign In</button>
  </form>
</div>
</body>
</html>
