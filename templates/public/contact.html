{% extends "base.html" %}
{% block title %}Contact Us — AutoStock Motors{% endblock %}
{% block nav_contact %}active{% endblock %}
{% block content %}
<section class="section" style="padding-bottom:0;">
  <div class="container center">
    <h1 style="font-size:clamp(28px,4vw,44px);font-weight:900;text-transform:uppercase;">Get In Touch</h1>
    <div class="divider center"></div>
    <p class="lead">Questions about a vehicle? We'd love to hear from you.</p>
  </div>
</section>

<section class="section" style="padding-top:40px;">
  <div class="container" style="max-width:820px;">
    <div class="panel">
      <form method="post" action="/contact">
        <div class="form-grid">
          <div class="field"><label for="full_name">Full Name *</label><input type="text" id="full_name" name="full_name" required></div>
          <div class="field"><label for="email">Email *</label><input type="email" id="email" name="email" required></div>
          <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" name="phone"></div>
          <div class="field"><label for="category">Category *</label>
            <select id="category" name="category" required>
              <option value="">Select a category</option>
              <option value="Sales">Sales Inquiry</option>
              <option value="Test Drive">Test Drive Booking</option>
              <option value="Trade In">Trade In Enquiry</option>
              <option value="Finance">Finance &amp; Insurance</option>
              <option value="Service">Service Appointment</option>
              <option value="Aftermarket">Aftermarket Parts</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field"><label for="subject">Subject</label><input type="text" id="subject" name="subject"></div>
          <div class="field"><label for="message">Message *</label><textarea id="message" name="message" required></textarea></div>
        </div>
        <div style="margin-top:26px;">
          <button type="submit" class="btn btn-gold btn-block">Send Message</button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
